name: Mobile announcements checks

on:
  push:
    branches:
      - feature/mobile-media-announcements
    paths:
      - "mobile-announcements/**"
      - ".github/workflows/mobile-announcements.yml"
  pull_request:
    paths:
      - "mobile-announcements/**"
      - ".github/workflows/mobile-announcements.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: mobile-announcements/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r mobile-announcements/requirements.txt

      - name: Compile Python files
        run: python -m compileall -q mobile-announcements

      - name: Run requested unit-test command
        run: python -m unittest discover -s mobile-announcements/tests -v
