name: Mobile announcements checks

on:
  push:
    branches:
      - feature/mobile-media-announcements
    paths:
      - "mobile-announcements/**"
      - ".github/workflows/mobile-announcements.yml"
  pull_request:
    paths:
      - "mobile-announcements/**"
      - ".github/workflows/mobile-announcements.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mobile-announcements/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r mobile-announcements/requirements.txt

      - name: Compile Python files
        run: python -m compileall -q mobile-announcements

      - name: Run unit tests
        working-directory: mobile-announcements
        run: python -m unittest discover -s tests -v
